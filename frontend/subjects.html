<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subjects | ITClassroom</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem 0; }
  .who { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
  .head { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .add { margin:1.5rem 0; display:none; }
  .add form { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.75rem; align-items:end; }
  .subjects { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1rem; margin-top:1rem; }
  a.subject { display:block; color:inherit; text-decoration:none; }
  a.subject:focus-visible { outline:3px solid currentColor; outline-offset:3px; }
  .progress-label { display:flex; justify-content:space-between; font-size:.85rem; opacity:.75; margin-top:.75rem; }
  .empty { opacity:.7; }
  .msg { color:#b00020; }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <a class="brand" href="subjects.html"><span class="star" aria-hidden="true"></span>ITClassroom</a>
    <div class="who">
      <span id="who">Loading...</span>
      <button class="btn" id="logout" type="button">Log out</button>
    </div>
  </header>

  <main>
    <div class="head">
      <h1>Your subjects</h1>
    </div>
    <p class="msg" id="list-msg" role="alert"></p>

    <!-- Faculty only: Name, Code, Term / Semester, Year (per whiteboard step 2) -->
    <section class="add" id="add-box">
      <h2>Add a subject</h2>
      <p class="msg" id="msg" role="alert"></p>
      <form id="add-form">
        <label class="field"><span>Name</span><input name="name" required></label>
        <label class="field"><span>Code</span><input name="code" required></label>
        <label class="field"><span>Term / Semester</span>
          <select name="term"><option>1st Semester</option><option>2nd Semester</option><option>Summer</option></select>
        </label>
        <label class="field"><span>Year</span><input name="year" placeholder="2026–2027" required></label>
        <button class="btn" type="submit">Add subject</button>
      </form>
    </section>

    <div class="subjects" id="list"></div>
    <p class="empty" id="empty" hidden></p>
  </main>

</div>

<script src="js/auth.js"></script>
<script>
 const list = document.getElementById("list");
const emptyEl = document.getElementById("empty");
let role = "";

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

// Each card opens the Table of Contents / list of topics (toc.html)
function card(s) {
  const a = el("a", undefined, "subject");
  a.href = "toc.html?subject=" + encodeURIComponent(s.id);
  a.setAttribute("aria-label", "Open " + s.name);
  a.append(el("span", s.code, "code"), el("h3", s.name));

  const dl = el("dl");
  dl.append(el("dt", "Term"), el("dd", s.term), el("dt", "Year"), el("dd", s.year));

  // Progress = share of topics passed (quiz 75%+). Shows 0% if the API doesn't send it yet.
  const pct = Math.max(0, Math.min(100, Number(s.progress) || 0));
  const bar = el("div", undefined, "bar");
  const i = el("i"); i.style.width = pct + "%";
  bar.append(i);

  a.append(dl, bar);
  if (role === "student") {
    const lbl = el("div", undefined, "progress-label");
    lbl.append(el("span", "Progress"), el("span", pct + "%"));
    a.append(lbl);
  }
  return a;
}

async function loadSubjects() {
  const r = await api("/subjects");
  const msg = document.getElementById("list-msg");
  if (!r.ok) {
    msg.textContent = (r.body && r.body.error) || "Couldn't load your subjects. Refresh the page to try again.";
    return;
  }
  msg.textContent = "";
  list.replaceChildren(...r.body.map(card));
  emptyEl.textContent = role === "faculty"
    ? "No subjects yet. Add your first subject above."
    : "No subjects yet. Your faculty will add them here.";
  emptyEl.hidden = r.body.length > 0;
}

api("/me").then(r => {
  if (!r.ok) { location.href = "login.html"; return; }
  role = r.body.role;
  document.getElementById("who").textContent = r.body.username + " (" + role + ")";
  if (role === "faculty") document.getElementById("add-box").style.display = "block";
  loadSubjects();
});

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const r = await api("/subjects", {
    name: f.name.value.trim(), code: f.code.value.trim(), term: f.term.value, year: f.year.value.trim(),
  });
  document.getElementById("msg").textContent = r.ok ? "" : ((r.body && r.body.error) || "Couldn't add the subject.");
  if (r.ok) { f.reset(); loadSubjects(); }
});

document.getElementById("logout").onclick = async () => {
  await api("/logout", {});
  location.href = "login.html";
};
</script>
</body>
</html>
